name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Generate signing keystore
        run: |
          cd android
          keytool -genkeypair -v \
            -keystore qrshield-release.keystore \
            -alias qrshield \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=QRShield, OU=App, O=QRShield Pro, L=City, S=State, C=US" \
            -storepass qrshield2025 \
            -keypass qrshield2025

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/qrshield-release.keystore \
            -Pandroid.injected.signing.store.password=qrshield2025 \
            -Pandroid.injected.signing.key.alias=qrshield \
            -Pandroid.injected.signing.key.password=qrshield2025 \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRShield-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
